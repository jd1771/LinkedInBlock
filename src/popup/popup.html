<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LinkedIn Company Blocker</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <script src="../utils/storageUtils.js"></script>
        <script src="../utils/domUtils.js"></script>
        <script src="viewScript.js"></script>
        <div class="container">
            <header class="header">
                <div class="header-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line>
                    </svg>
                </div>
                <div class="header-text">
                    <h1 id="title">LinkedIn Blocker</h1>
                    <p class="subtitle">Companies hidden from your job search</p>
                </div>
                <span class="count-badge" id="count-badge" hidden>0</span>
            </header>
            <div id="blocked-companies">
                <div class="spinner"></div>
                <div class="empty-state">
                    <p class="empty-title">No companies blocked</p>
                    <p class="empty-hint">Open the "..." menu on a job or company page and choose <strong>Block company</strong>.</p>
                </div>
                <ul class="company-list"></ul>
            </div>
        </div>
    </body>
</html>
